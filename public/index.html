<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">بوابة المساعد الدراسي</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                brand: {
                    50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa',
                    300: '#fdba74', 400: '#fb923c', 500: '#f97316',
                    600: '#ea580c', 700: '#c2410c'
                }
            },
            fontFamily: { sans: ['Inter', 'Cairo', 'sans-serif'] }
        }
    }
};
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f97316">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Portal">
<meta name="mobile-web-app-capable" content="yes">

<!-- ============ STYLE ============ -->
<!-- سيُضاف في المرحلة 2 -->

</head>

<body class="h-full font-sans antialiased text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900">

<!-- ============================================================
     الشاشة 1: تسجيل دخول الحساب الرئيسي
     ============================================================ -->
<div id="accountScreen" class="fixed inset-0 z-[100] overflow-y-auto" style="background: linear-gradient(135deg, #f97316 0%, #f59e0b 50%, #ea580c 100%);">
    
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-white/10 blur-3xl"></div>
        <div class="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-white/10 blur-3xl"></div>
        <div class="absolute top-1/3 left-1/4 w-64 h-64 rounded-full bg-amber-300/20 blur-2xl"></div>
    </div>
    
    <div class="relative min-h-full flex items-center justify-center p-4">
        <div class="relative w-full max-w-md">
            
            <div class="text-center mb-6">
                <div class="w-20 h-20 rounded-3xl bg-white shadow-2xl mx-auto flex items-center justify-center mb-4">
                    <i class="fa-solid fa-graduation-cap text-4xl" style="color: #f97316;"></i>
                </div>
                <h1 class="text-3xl font-black text-white mb-1">بوابة المساعد الدراسي</h1>
                <p class="text-sm font-semibold text-white/90">الثانية علوم 09</p>
            </div>
            
            <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden">
                
                <div class="p-2 bg-slate-100 dark:bg-slate-700">
                    <div class="grid grid-cols-2 gap-1 rounded-2xl p-1 bg-slate-200 dark:bg-slate-600">
                        <button id="tabAccLoginBtn" onclick="showAccTab('login')" class="py-3 rounded-xl text-sm font-bold bg-white text-slate-900 shadow-sm">
                            تسجيل الدخول
                        </button>
                        <button id="tabAccRegisterBtn" onclick="showAccTab('register')" class="py-3 rounded-xl text-sm font-bold text-slate-500 dark:text-slate-300">
                            حساب جديد
                        </button>
                    </div>
                </div>
                
                <div class="p-6 sm:p-8">
                    
                    <!-- نموذج دخول الحساب -->
                    <form id="accLoginForm" onsubmit="submitAccLogin(event)" class="space-y-5">
                        <div class="text-center mb-2">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white">أهلاً بعودتك</h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">سجّل دخولك للمتابعة</p>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">اسم الحساب</label>
                            <div class="relative">
                                <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" id="accLoginUsername" required autocomplete="username" placeholder="اسم الحساب" class="w-full pl-11 pr-4 py-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm font-medium focus:outline-none focus:border-brand-500 transition-all">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">كلمة السر</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="password" id="accLoginPassword" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-11 pr-4 py-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm font-medium focus:outline-none focus:border-brand-500 transition-all">
                            </div>
                        </div>
                        
                        <p id="accLoginError" class="text-xs font-bold text-red-500 text-center hidden"></p>
                        
                        <button type="submit" id="accLoginBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-brand-500 to-amber-500 hover:from-brand-600 hover:to-amber-600 text-white text-sm font-black shadow-lg transition-all">
                            <i class="fa-solid fa-right-to-bracket mr-2"></i> دخول
                        </button>
                    </form>
                    
                    <!-- نموذج إنشاء الحساب -->
                    <form id="accRegisterForm" onsubmit="submitAccRegister(event)" class="space-y-5 hidden">
                        <div class="text-center mb-2">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white">حساب جديد</h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">أنشئ حسابك في ثوان</p>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">اسم الحساب</label>
                            <div class="relative">
                                <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" id="accRegisterUsername" required minlength="3" autocomplete="username" placeholder="3 أحرف على الأقل" class="w-full pl-11 pr-4 py-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm font-medium focus:outline-none focus:border-brand-500 transition-all">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">كلمة السر</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="password" id="accRegisterPassword" required minlength="4" autocomplete="new-password" placeholder="4 أحرف على الأقل" class="w-full pl-11 pr-4 py-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm font-medium focus:outline-none focus:border-brand-500 transition-all">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">تأكيد كلمة السر</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="password" id="accRegisterPassword2" required autocomplete="new-password" placeholder="أعد كتابة كلمة السر" class="w-full pl-11 pr-4 py-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm font-medium focus:outline-none focus:border-brand-500 transition-all">
                            </div>
                        </div>
                        
                        <p id="accRegisterError" class="text-xs font-bold text-red-500 text-center hidden"></p>
                        
                        <button type="submit" id="accRegisterBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-brand-500 to-amber-500 hover:from-brand-600 hover:to-amber-600 text-white text-sm font-black shadow-lg transition-all">
                            <i class="fa-solid fa-user-plus mr-2"></i> إنشاء الحساب
                        </button>
                    </form>
                    
                </div>
            </div>
            
            <p class="text-center text-[11px] font-semibold text-white/80 mt-6">
                <i class="fa-solid fa-shield-halved mr-1"></i> بياناتك محفوظة بأمان
            </p>

            <div class="mt-4 pt-4 border-t border-white/20 text-center">
                <button onclick="openParentAuth()" class="inline-flex items-center gap-2 text-white/80 hover:text-white text-xs font-semibold transition-colors py-2 px-3 rounded-lg hover:bg-white/10">
                    <i class="fa-solid fa-user-shield text-xs"></i>
                    <span>هل أنت ولي أمر؟ ادخل من هنا</span>
                </button>
            </div>
        </div>
    </div>
</div>
