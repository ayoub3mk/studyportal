<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة المساعد الدراسي</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                brand: {
                    50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa',
                    300: '#fdba74', 400: '#fb923c', 500: '#f97316',
                    600: '#ea580c', 700: '#c2410c'
                }
            },
            fontFamily: { sans: ['Inter', 'Cairo', 'sans-serif'] }
        }
    }
};
/* ============================================================
   نظام تسجيل الدخول والمزامنة مع السيرفر
   ============================================================ */

/* عنوان السيرفر - فارغ يعني نفس النطاق */
var API_BASE = '';

/* الرمز الحالي للمستخدم (يُحفظ في localStorage) */
var AUTH_TOKEN = null;
var CURRENT_USER = null;

/* إظهار تبويب معين (دخول أو إنشاء حساب) */
function showAuthTab(tab) {
    var loginBtn = document.getElementById('tabLoginBtn');
    var registerBtn = document.getElementById('tabRegisterBtn');
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    
    if (tab === 'login') {
        loginBtn.classList.add('bg-brand-500', 'text-white');
        loginBtn.classList.remove('text-slate-600', 'dark:text-slate-300');
        registerBtn.classList.remove('bg-brand-500', 'text-white');
        registerBtn.classList.add('text-slate-600', 'dark:text-slate-300');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
    } else {
        registerBtn.classList.add('bg-brand-500', 'text-white');
        registerBtn.classList.remove('text-slate-600', 'dark:text-slate-300');
        loginBtn.classList.remove('bg-brand-500', 'text-white');
        loginBtn.classList.add('text-slate-600', 'dark:text-slate-300');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
    }
}

/* إظهار خطأ في نموذج الدخول */
function showLoginError(msg) {
    var el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.remove('hidden');
}
function hideLoginError() {
    document.getElementById('loginError').classList.add('hidden');
}
function showRegisterError(msg) {
    var el = document.getElementById('registerError');
    el.textContent = msg;
    el.classList.remove('hidden');
}
function hideRegisterError() {
    document.getElementById('registerError').classList.add('hidden');
}

/* إرسال طلب تسجيل الدخول */
function submitLogin(e) {
    e.preventDefault();
    hideLoginError();
    
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn = document.getElementById('loginSubmitBtn');
    
    if (!username || !password) {
        showLoginError('املأ كل الحقول');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'جار التحقق...';
    
    fetch(API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: username, password: password })
    })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, status: r.status, data: j }; }); })
    .then(function(res) {
        btn.disabled = false;
        btn.textContent = 'دخول';
        
        if (!res.ok) {
            showLoginError(res.data.message || 'اسم المستخدم أو كلمة السر غير صحيحة');
            return;
        }
        
        /* نجح الدخول */
        AUTH_TOKEN = res.data.token;
        CURRENT_USER = res.data.user;
        try {
            localStorage.setItem('study_auth_token', AUTH_TOKEN);
            localStorage.setItem('study_current_user', JSON.stringify(CURRENT_USER));
        } catch (e) {}
        
        onLoginSuccess();
    })
    .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'دخول';
        showLoginError('تعذر الاتصال بالسيرفر. تحقق من الإنترنت.');
        console.error(err);
    });
}

/* إرسال طلب إنشاء حساب */
function submitRegister(e) {
    e.preventDefault();
    hideRegisterError();
    
    var username = document.getElementById('registerUsername').value.trim();
    var password = document.getElementById('registerPassword').value;
    var password2 = document.getElementById('registerPassword2').value;
    var btn = document.getElementById('registerSubmitBtn');
    
    if (!username || !password || !password2) {
        showRegisterError('املأ كل الحقول');
        return;
    }
    if (password !== password2) {
        showRegisterError('كلمتا السر غير متطابقتين');
        return;
    }
    if (password.length < 4) {
        showRegisterError('كلمة السر قصيرة جدا');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'جار الإنشاء...';
    
    fetch(API_BASE + '/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: username, password: password })
    })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, status: r.status, data: j }; }); })
    .then(function(res) {
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب';
        
        if (!res.ok) {
            showRegisterError(res.data.message || 'تعذر إنشاء الحساب');
            return;
        }
        
        /* نجح الإنشاء */
        AUTH_TOKEN = res.data.token;
        CURRENT_USER = res.data.user;
        try {
            localStorage.setItem('study_auth_token', AUTH_TOKEN);
            localStorage.setItem('study_current_user', JSON.stringify(CURRENT_USER));
        } catch (e) {}
        
        onLoginSuccess();
    })
    .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب';
        showRegisterError('تعذر الاتصال بالسيرفر');
        console.error(err);
    });
}

/* عند نجاح الدخول أو الإنشاء */
function onLoginSuccess() {
    /* إخفاء شاشة تسجيل الدخول */
    document.getElementById('authScreen').classList.add('hidden');
    
    /* جلب البيانات من السيرفر */
    loadDataFromServer().then(function() {
        /* عرض الواجهة الرئيسية */
        if (typeof renderView === 'function') {
            renderView();
        }
    }).catch(function(err) {
        console.error('خطأ في جلب البيانات:', err);
        alert('تعذر جلب البيانات من السيرفر');
    });
}

/* جلب البيانات من السيرفر */
function loadDataFromServer() {
    return fetch(API_BASE + '/api/me', {
        credentials: 'include',
        headers: AUTH_TOKEN ? { 'Authorization': 'Bearer ' + AUTH_TOKEN } : {}
    })
    .then(function(r) {
        if (r.status === 401) {
            /* الجلسة انتهت */
            logoutUser();
            return Promise.reject('unauthorized');
        }
        return r.json();
    })
    .then(function(data) {
        if (!data || !data.user) {
            return Promise.reject('no data');
        }
        
        var u = data.user;
        
        /* تحديث الحالة العامة */
        appState.lang = u.lang || 'ar';
        appState.darkMode = !!u.darkMode;
        appState.profiles = [{
            id: 'me',
            name: u.name,
            password: '',
            avatar: u.avatar || DEFAULT_AVATAR,
            grade: u.grade || '',
            term: u.term || '',
            examType: u.examType || '',
            schoolYear: u.schoolYear || '',
            subjects: u.subjects || [],
            timetable: u.timetable || {},
            homework: u.homework || []
        }];
        appState.activeUserId = 'me';
        
        /* إخفاء شاشة الحسابات المتعددة */
        var homeView = document.getElementById('homeView');
        if (homeView) homeView.classList.add('hidden');
        
        /* تطبيق اللغة والوضع */
        if (typeof applyTheme === 'function') applyTheme();
        if (typeof applyUILanguage === 'function') applyUILanguage();
    });
}

/* حفظ البيانات على السيرفر */
function saveStateToServer() {
    if (!AUTH_TOKEN) return Promise.resolve();
    
    var p = null;
    for (var i = 0; i < appState.profiles.length; i++) {
        if (appState.profiles[i].id === 'me') { p = appState.profiles[i]; break; }
    }
    if (!p) return Promise.resolve();
    
    var body = {
        name: p.name,
        avatar: p.avatar,
        grade: p.grade,
        term: p.term,
        examType: p.examType,
        schoolYear: p.schoolYear,
        subjects: p.subjects,
        timetable: p.timetable,
        homework: p.homework,
        lang: appState.lang,
        darkMode: appState.darkMode
    };
    
    return fetch(API_BASE + '/api/me', {
        method: 'PUT',
        credentials: 'include',
        headers: Object.assign(
            { 'Content-Type': 'application/json' },
            AUTH_TOKEN ? { 'Authorization': 'Bearer ' + AUTH_TOKEN } : {}
        ),
        body: JSON.stringify(body)
    })
    .then(function(r) { return r.json(); })
    .catch(function(err) {
        console.error('فشل الحفظ على السيرفر:', err);
    });
}

/* تسجيل الخروج */
function logoutUser() {
    fetch(API_BASE + '/api/logout', {
        method: 'POST',
        credentials: 'include'
    }).catch(function() {});
    
    try {
        localStorage.removeItem('study_auth_token');
        localStorage.removeItem('study_current_user');
    } catch (e) {}
    
    AUTH_TOKEN = null;
    CURRENT_USER = null;
    
    /* إعادة تحميل الصفحة */
    location.reload();
}

/* عند تحميل الصفحة: التحقق من وجود جلسة سابقة */
function checkExistingSession() {
    try {
        var savedToken = localStorage.getItem('study_auth_token');
        var savedUser = localStorage.getItem('study_current_user');
        if (savedToken) {
            AUTH_TOKEN = savedToken;
            if (savedUser) CURRENT_USER = JSON.parse(savedUser);
            
            /* التحقق من صلاحية الرمز بطلب me */
            return loadDataFromServer().then(function() {
                document.getElementById('authScreen').classList.add('hidden');
                if (typeof renderView === 'function') renderView();
                return true;
            }).catch(function() {
                /* الرمز غير صالح */
                AUTH_TOKEN = null;
                CURRENT_USER = null;
                try {
                    localStorage.removeItem('study_auth_token');
                    localStorage.removeItem('study_current_user');
                } catch (e) {}
                return false;
            });
        }
    } catch (e) {
        console.error(e);
    }
    return Promise.resolve(false);
}
</script>

<body class="h-full font-sans antialiased text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
    <!-- ============================================================
     شاشة تسجيل الدخول / إنشاء حساب
     تظهر فقط عندما لا يكون المستخدم مسجلا
     ============================================================ -->
<div id="authScreen" class="fixed inset-0 z-[100] bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        
        <!-- الشعار والعنوان -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-brand-600 to-amber-500 text-white flex items-center justify-center shadow-xl mx-auto mb-4">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white mb-1">بوابة المساعد الدراسي</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">الثانية علوم 09</p>
        </div>

        <!-- البطاقة -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-6">
            
            <!-- التبويبات -->
            <div class="grid grid-cols-2 gap-2 mb-6 bg-slate-100 dark:bg-slate-700 rounded-xl p-1">
                <button id="tabLoginBtn" onclick="showAuthTab('login')" class="py-2 rounded-lg text-sm font-bold bg-brand-500 text-white transition-colors">
                    تسجيل الدخول
                </button>
                <button id="tabRegisterBtn" onclick="showAuthTab('register')" class="py-2 rounded-lg text-sm font-bold text-slate-600 dark:text-slate-300 transition-colors">
                    حساب جديد
                </button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">اسم المستخدم</label>
                    <input type="text" id="loginUsername" required class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="اسم المستخدم">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">كلمة السر</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
                </div>
                <p id="loginError" class="text-xs font-semibold text-red-500 text-center hidden"></p>
                <button type="submit" id="loginSubmitBtn" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-md transition-colors">
                    دخول
                </button>
            </form>

            <!-- نموذج إنشاء حساب -->
            <form id="registerForm" onsubmit="submitRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">اسم المستخدم</label>
                    <input type="text" id="registerUsername" required minlength="3" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="3 أحرف على الأقل">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">كلمة السر</label>
                    <input type="password" id="registerPassword" required minlength="4" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="4 أحرف على الأقل">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">تأكيد كلمة السر</label>
                    <input type="password" id="registerPassword2" required class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="أعد كتابة كلمة السر">
                </div>
                <p id="registerError" class="text-xs font-semibold text-red-500 text-center hidden"></p>
                <button type="submit" id="registerSubmitBtn" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-md transition-colors">
                    إنشاء الحساب
                </button>
            </form>

        </div>

        <p class="text-center text-[11px] text-slate-400 dark:text-slate-500 mt-6">
            بياناتك محفوظة بأمان على السيرفر
        </p>
    </div>
</div>

function buildDefaultSubjects() {
    var out = [];

        var def = DEFAULT_SUBJECTS[i];
        var subj = {
            id: "subj_default_" + i,

        if (def.multiSection) {

            subj.sections = [];
            for (var k = 0; k < DEFAULT_MATH_SECTIONS.length; k++) {
                var sec = DEFAULT_MATH_SECTIONS[k];
                var items = [];
                for (var p = 0; p < sec.papers.length; p++) {
                    items.push({code: sec.papers[p], checked: false, note: "", link: ""});
                }
                subj.sections.push({
                    key: sec.key,
                    labelKey: sec.labelKey,
                    badgeKey: sec.badgeKey,
                    items: items
                });
            }
        } else {
            /* مادة عادية - items مسطحة */
            var papers = DEFAULT_PAPERS[def.ar] || [];
            subj.items = [];
            for (var j = 0; j < papers.length; j++) {
                subj.items.push({code: papers[j], checked: false, note: "", link: ""});
            }
        }
        out.push(subj);
    }
    return out;
}

function countProgress(p) {
    var total = 0, done = 0;
    if (!p || !Array.isArray(p.subjects)) return {total: 0, done: 0};
    for (var i = 0; i < p.subjects.length; i++) {
        var s = p.subjects[i];
        if (Array.isArray(s.sections)) {
            for (var k = 0; k < s.sections.length; k++) {
                var items = s.sections[k].items || [];
                for (var j = 0; j < items.length; j++) {
                    total++;
                    if (items[j].checked) done++;
                }
            }
        } else if (Array.isArray(s.items)) {
            for (var j2 = 0; j2 < s.items.length; j2++) {
                total++;
                if (s.items[j2].checked) done++;
            }
        }
    }
    return {total: total, done: done};
}

            }
            var subPct = total > 0 ? Math.round(done / total * 100) : 0;
            var nm = displayName(subj);

            var examBadge = "";
            if (subj.examDate) {
                var d = new Date(subj.examDate);
                var diff = Math.ceil((d - today) / 86400000);
                var cls = "bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300";
                var txt = d.toLocaleDateString(localeTag());
                if (diff < 0) {
                    cls = "bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300";
                    txt = (appState.lang === "ar" ? "انتهى · " : appState.lang === "fr" ? "Passé · " : "Past · ") + txt;
                } else if (diff === 0) {
                    cls = "bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300";
                    txt = t("dayToday");
                } else if (diff <= 3) {
                    cls = "bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300";
                    txt = (appState.lang === "ar" ? "بعد " : appState.lang === "fr" ? "Dans " : "In ") + diff + " " + t("dayCount");
                }
                examBadge = '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md ' + cls + '"><i class="fa-solid fa-calendar-check mr-1"></i>' + escapeHtml(txt) + '</span>';
            }

            /* بناء قائمة الأوراق — عادية أو أقسام */
            var itemsHtml = "";

            if (Array.isArray(subj.sections)) {
                /* رياضيات — قسمان */
                for (var sIdx = 0; sIdx < subj.sections.length; sIdx++) {
                    var sec = subj.sections[sIdx];
                    var badgeText = t(sec.badgeKey || ("sectionBadge" + sec.key));
                    var labelText = t(sec.labelKey || ("sectionControl" + sec.key));
                    itemsHtml += '<div class="section-header"><span class="section-badge">' + escapeHtml(badgeText) + '</span><span>' + escapeHtml(labelText) + '</span></div>';
                    for (var idx = 0; idx < sec.items.length; idx++) {
                        itemsHtml += renderItemRow(subj.id, sec.key, sec.items[idx], idx, search, filter);
                    }
                }
            } else if (Array.isArray(subj.items)) {
                for (var idx2 = 0; idx2 < subj.items.length; idx2++) {
                    itemsHtml += renderItemRow(subj.id, null, subj.items[idx2], idx2, search, filter);
                }
            }

            if (!itemsHtml || itemsHtml.replace(/<div class="section-header">.*?<\/div>/g, "").trim() === "") {
                itemsHtml = '<p class="text-xs text-slate-400 dark:text-slate-500 text-center py-3">—</p>';
            }

            var card = document.createElement("div");
            card.className = "bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col";

            var cardHtml = "";
            cardHtml += '<div class="p-4 bg-slate-50 dark:bg-slate-700/40 border-b border-slate-200 dark:border-slate-700">';
            cardHtml += '<div class="flex items-center justify-between gap-2">';
            cardHtml += '<h3 class="font-bold text-sm text-brand-700 dark:text-brand-300 uppercase truncate">' + escapeHtml(nm) + '</h3>';
            cardHtml += '<div class="flex items-center gap-1 flex-shrink-0">';
            cardHtml += '<button onclick="openEditSubject(\'' + subj.id + '\')" class="w-7 h-7 rounded-md text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs"><i class="fa-solid fa-pen"></i></button>';
            cardHtml += '<button onclick="deleteSubject(\'' + subj.id + '\')" class="w-7 h-7 rounded-md text-slate-500 dark:text-slate-400 hover:bg-red-100 dark:hover:bg-red-900/40 hover:text-red-600 text-xs"><i class="fa-solid fa-trash-can"></i></button>';
            cardHtml += '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-brand-100 dark:bg-brand-950/80 text-brand-700 dark:text-brand-300 ml-1">' + done + '/' + total + '</span>';
            cardHtml += '</div></div>';
            if (examBadge) cardHtml += '<div class="mt-2">' + examBadge + '</div>';
            cardHtml += '<div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 mt-2 overflow-hidden"><div class="bg-brand-500 h-1.5 rounded-full transition-all" style="width:' + subPct + '%"></div></div>';
            cardHtml += '</div>';
            cardHtml += '<div class="p-3 space-y-1.5 custom-scrollbar max-h-[420px] overflow-y-auto">' + itemsHtml + '</div>';
            cardHtml += '</div>';

            card.innerHTML = cardHtml;
            c.appendChild(card);
        })(p.subjects[i]);
    }
}

/* دالة عرض صف ورقة */
function renderItemRow(subjectId, sectionKey, item, idx, search, filter) {
    var mS = !search || item.code.toLowerCase().indexOf(search) !== -1 || (item.note || "").toLowerCase().indexOf(search) !== -1;
    var mF = filter === "all" || (filter === "completed" && item.checked) || (filter === "pending" && !item.checked);
    if (!mS || !mF) return "";

    var linkIcon;
    if (item.link) {
        linkIcon = '<a href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener" class="text-brand-600 dark:text-brand-400 text-xs px-1"><i class="fa-solid fa-link"></i></a>';
    } else {
        linkIcon = '<button onclick="openLinkModal(\'' + subjectId + '\', \'' + (sectionKey || "") + '\', ' + idx + ')" class="text-slate-300 dark:text-slate-600 hover:text-brand-500 text-xs px-1"><i class="fa-solid fa-link"></i></button>';
    }

    var html = '<div class="flex items-center gap-2 py-1.5 px-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 group/item">';
    html += '<button onclick="toggleItem(\'' + subjectId + '\', \'' + (sectionKey || "") + '\', ' + idx + ')" class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs flex-shrink-0 ' +
        (item.checked ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400 border border-slate-300 dark:border-slate-600 hover:border-brand-500') +
        '">' + (item.checked ? '<i class="fa-solid fa-check"></i>' : '') + '</button>';
    html += '<input type="text" value="' + escapeHtml(item.code) + '" onchange="updateItemCode(\'' + subjectId + '\', \'' + (sectionKey || "") + '\', ' + idx + ', this.value)" class="w-20 sm:w-28 text-center text-sm font-extrabold text-slate-800 dark:text-slate-100 bg-slate-100 dark:bg-slate-700/80 border border-slate-200 dark:border-slate-600 rounded-lg py-1 px-1 font-mono">';
    html += '<input type="text" value="' + escapeHtml(item.note || "") + '" placeholder="' + escapeHtml(t("notePlaceholder")) + '" onchange="updateItemNote(\'' + subjectId + '\', \'' + (sectionKey || "") + '\', ' + idx + ', this.value)" class="flex-1 min-w-0 text-xs text-slate-600 dark:text-slate-300 bg-transparent border-b border-slate-200 dark:border-slate-700 py-1 px-2">';
    html += linkIcon;
    html += '<button onclick="deleteItem(\'' + subjectId + '\', \'' + (sectionKey || "") + '\', ' + idx + ')" class="text-slate-300 dark:text-slate-600 hover:text-red-500 text-xs px-1 opacity-0 group-hover/item:opacity-100 transition-opacity"><i class="fa-solid fa-trash-can"></i></button>';
    html += '</div>';
    return html;
}

/* ============ 19. عمليات الورقة ============ */
function getItemContainer(subjectId, sectionKey) {
    var s = findSubjectById(subjectId);
    if (!s) return null;
    if (sectionKey) {
        if (!Array.isArray(s.sections)) return null;
        for (var i = 0; i < s.sections.length; i++) {
            if (String(s.sections[i].key) === String(sectionKey)) return s.sections[i].items;
        }
        return null;
    }
    return s.items || null;
}

function toggleItem(sid, secKey, i) {
    var arr = getItemContainer(sid, secKey);
    if (!arr || !arr[i]) return;
    arr[i].checked = !arr[i].checked;
    saveState();
    renderDashboard();
}
function updateItemCode(sid, secKey, i, v) {
    var arr = getItemContainer(sid, secKey);
    if (!arr || !arr[i]) return;
    arr[i].code = v;
    saveState();
}
function updateItemNote(sid, secKey, i, v) {
    var arr = getItemContainer(sid, secKey);
    if (!arr || !arr[i]) return;
    arr[i].note = v;
    saveState();
}
function deleteItem(sid, secKey, i) {
    var arr = getItemContainer(sid, secKey);
    if (!arr || !arr[i]) return;
    if (!confirm(t("itemConfirmDelete"))) return;
    arr.splice(i, 1);
    saveState();
    renderDashboard();
}

function saveSubject(e) {
    e.preventDefault();

    var ar = document.getElementById("subjectTitleAr").value.trim();
    var fr = document.getElementById("subjectTitleFr").value.trim();
    var en = document.getElementById("subjectTitleEn").value.trim();
    var examDate = document.getElementById("subjectExamDateInput").value;
    var rawItems = document.getElementById("subjectItemsInput").value.trim();
    if (!ar) return;

        var s = findSubjectById(editingSubjectId);
        if (s) {
            s.name = name;
            s.examDate = examDate;
            if (rawItems && Array.isArray(s.items)) {
                var codes = rawItems.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
                s.items = codes.map(function(c){ return {code: c, checked: false, note: "", link: ""}; });
            }
        }
    } else {
        var codes2 = rawItems ? rawItems.split("\n").map(function(x){ return x.trim(); }).filter(Boolean) : [];
        p.subjects.push({
            id: "subj_" + Date.now(),
            name: name,
            examDate: examDate,
            items: codes2.map(function(c){ return {code: c, checked: false, note: "", link: ""}; })
        });
    }
    saveState();
    closeSubjectModal();
    renderDashboard();

function deleteSubject(id) {
    var p = getActiveProfile();
    if (!p) return;
    if (!confirm(t("subjConfirmDelete") + " " + t("subjConfirmDeleteEnd"))) return;
    p.subjects = p.subjects.filter(function(x){ return x.id !== id; });

    for (var i = 0; i < days.length; i++) {
        p.timetable[days[i]] = p.timetable[days[i]].filter(function(slot){ return slot.subjectId !== id; });
    }
    p.homework = p.homework.filter(function(h){ return h.subjectId !== id; });
    saveState();
    renderDashboard();
}

function renderTimetable() {
    var p = getActiveProfile();
    if (!p) return;
    var container = document.getElementById("timetableGrid");
    if (!container) return;
    container.innerHTML = "";

    var week = currentWeekLetter();

    var table = document.createElement("table");
    table.className = "tt-table";

    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    var corner = document.createElement("th");
    corner.className = "tt-day-head";
    headRow.appendChild(corner);
    for (var c = 0; c < TIME_COLUMNS.length; c++) {
        var th = document.createElement("th");
        th.className = "tt-hour-head";
        th.textContent = TIME_COLUMNS[c];
        headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    for (var d = 0; d < DAY_KEYS.length; d++) {
        (function(day){
            var row = document.createElement("tr");
            var dayTd = document.createElement("td");
            dayTd.className = "tt-day-cell";
            dayTd.textContent = dayLabel(day);
            row.appendChild(dayTd);

            var slots = (p.timetable[day] || []).filter(function(s){ return s.week === "AB" || s.week === week; });
            var covered = [];
            for (var z = 0; z < TIME_COLUMNS.length; z++) covered[z] = false;

            for (var i = 0; i < TIME_COLUMNS.length; i++) {
                if (covered[i]) continue;
                var hour = TIME_COLUMNS[i];
                var slot = null;
                for (var k = 0; k < slots.length; k++) if (slots[k].start === hour) { slot = slots[k]; break; }

                if (slot) {
                    var endIdx = TIME_COLUMNS.indexOf(slot.end);
                    var span = (endIdx > i) ? (endIdx - i) : 1;
                    var td = document.createElement("td");
                    td.className = "tt-slot";
                    td.colSpan = span;
                    td.style.verticalAlign = "top";

                    var block = document.createElement("div");
                    block.className = "tt-block tt-subject";
                    if (slot.week === "A") block.classList.add("week-a");
                    else if (slot.week === "B") block.classList.add("week-b");

                    var subj = findSubjectById(slot.subjectId);
                    var nm = subj ? displayName(subj) : "—";
                    var rm = displayRoom(slot.room);
                    block.innerHTML = '<div class="font-bold leading-tight">' + escapeHtml(nm) + '</div>' +
                        '<div class="text-[10px] opacity-80">' + escapeHtml(rm) + ' · ' + slot.start + '-' + slot.end + '</div>' +
                        '<div class="text-[9px] opacity-60 mt-0.5">' + (slot.week === "AB" ? "A+B" : slot.week) + '</div>';

                    var realIdx = p.timetable[day].indexOf(slot);
                    (function(dd, ii){ block.onclick = function(){ openSlotModal(dd, ii); }; })(day, realIdx);
                    td.appendChild(block);
                    row.appendChild(td);
                    for (var kk = i; kk < i + span; kk++) covered[kk] = true;
                } else {
                    var eTd = document.createElement("td");
                    eTd.className = "tt-slot";
                    var empty = document.createElement("div");
                    empty.className = "tt-empty";
                    empty.textContent = "—";
                    (function(dd, hh){ empty.onclick = function(){ openSlotModal(dd, -1, hh); }; })(day, hour);
                    eTd.appendChild(empty);
                    row.appendChild(eTd);
                }
            }
            tbody.appendChild(row);
        })(DAY_KEYS[d]);
    }
    table.appendChild(tbody);
    container.appendChild(table);
}

function openSlotModal(day, idx, defaultStart) {
    var p = getActiveProfile();
    if (!p) return;
    editingSlot = {day: day, index: idx};

    var sel = document.getElementById("slotSubjectSelect");
    sel.innerHTML = "";
    for (var i = 0; i < p.subjects.length; i++) {
        var o = document.createElement("option");
        o.value = p.subjects[i].id;
        o.textContent = displayName(p.subjects[i]);
        sel.appendChild(o);
    }

    setText("slotModalContext", dayLabel(day) + " — " + (idx >= 0 ? t("slotContextEdit") : t("slotContextAdd")));

    if (idx >= 0) {
        var slot = p.timetable[day][idx];
        sel.value = slot.subjectId;
        document.getElementById("slotRoomInput").value = slot.room || "";
        document.getElementById("slotStartInput").value = slot.start || "08:00";
        document.getElementById("slotEndInput").value = slot.end || "09:00";
        document.getElementById("slotWeekInput").value = slot.week || "AB";
        document.getElementById("btnDeleteSlot").style.display = "";
    } else {
        if (sel.options.length > 0) sel.selectedIndex = 0;
        document.getElementById("slotRoomInput").value = "";
        document.getElementById("slotStartInput").value = defaultStart || "08:00";
        var m2 = timeToMins(defaultStart || "08:00") + 60;
        var eh = String(Math.floor(m2 / 60)).padStart(2, "0");
        var em = String(m2 % 60).padStart(2, "0");
        document.getElementById("slotEndInput").value = eh + ":" + em;
        document.getElementById("slotWeekInput").value = "AB";
        document.getElementById("btnDeleteSlot").style.display = "none";
    }
    document.getElementById("slotModal").classList.remove("hidden");
}
function closeSlotModal() {
    document.getElementById("slotModal").classList.add("hidden");
    editingSlot = {day: null, index: null};
}
function saveSlot(e) {
    e.preventDefault();
    var p = getActiveProfile();
    if (!p) return;
    var day = editingSlot.day;
    if (!day) return;
    var subjectId = document.getElementById("slotSubjectSelect").value;
    var room = document.getElementById("slotRoomInput").value.trim();
    var start = document.getElementById("slotStartInput").value;
    var end = document.getElementById("slotEndInput").value;
    var week = document.getElementById("slotWeekInput").value;
    if (!subjectId) return;
    if (timeToMins(end) <= timeToMins(start)) return;

    if (!Array.isArray(p.timetable[day])) p.timetable[day] = [];
    var slot = {subjectId: subjectId, room: room, start: start, end: end, week: week};
    if (editingSlot.index >= 0) {
        p.timetable[day][editingSlot.index] = slot;
    } else {
        p.timetable[day].push(slot);
    }
    p.timetable[day].sort(function(a, b){ return a.start.localeCompare(b.start); });
    saveState();
    closeSlotModal();
    renderTimetable();
    renderSmartAssistant();
}
function clearSlot() {
    var p = getActiveProfile();
    if (!p) return;
    var day = editingSlot.day;
    if (!day || editingSlot.index < 0) return;
    if (!confirm(t("slotConfirmDelete"))) return;
    p.timetable[day].splice(editingSlot.index, 1);
    saveState();
    closeSlotModal();
    renderTimetable();
    renderSmartAssistant();
}
function resetTimetable() {
    var p = getActiveProfile();
    if (!p) return;
    if (!confirm(t("ttConfirmReset"))) return;
    p.timetable = buildDefaultTimetable();
    saveState();
    renderTimetable();
    renderSmartAssistant();
}
function setManualWeek(w) {
    appState.manualWeek = (w === "auto") ? null : w;
    saveState();
    renderWeekToggle();
    renderTimetable();
    renderSmartAssistant();
}
function renderWeekToggle() {
    var cur = currentWeekLetter();
    var man = appState.manualWeek;
    var hA = document.getElementById("weekABtn");
    var hB = document.getElementById("weekBBtn");
    if (hA && hB) {
        hA.classList.toggle("active", man === "A" || (man === null && cur === "A"));
        hB.classList.toggle("active", man === "B" || (man === null && cur === "B"));
    }
    var tA = document.getElementById("ttWeekA");
    var tB = document.getElementById("ttWeekB");
    var tAuto = document.getElementById("ttWeekAuto");
    if (tA && tB && tAuto) {
        tA.classList.toggle("active", man === "A");
        tB.classList.toggle("active", man === "B");
        tAuto.classList.toggle("active", man === null);
    }
}

/* ============ 24. الواجبات ============ */
function renderHomework() {
    var p = getActiveProfile();
    if (!p) return;
    var list = document.getElementById("homeworkList");
    if (!list) return;
    list.innerHTML = "";

    var sel = document.getElementById("hwSubjectSelect");
    if (sel) {
        sel.innerHTML = "";
        for (var i = 0; i < p.subjects.length; i++) {
            var o = document.createElement("option");
            o.value = p.subjects[i].id;
            o.textContent = displayName(p.subjects[i]);
            sel.appendChild(o);
        }
    }

    var hw = p.homework || [];
    var cAll = hw.length;
    var cDone = 0, cPending = 0;
    for (var i = 0; i < hw.length; i++) { if (hw[i].completed) cDone++; else cPending++; }
    setText("hwCountAll", cAll);
    setText("hwCountCompleted", cDone);
    setText("hwCountPending", cPending);

    var filterBtns = document.querySelectorAll(".hw-filter-btn");
    for (var f = 0; f < filterBtns.length; f++) {
        var active = filterBtns[f].dataset.hwf === hwFilter;
        filterBtns[f].classList.toggle("bg-brand-500", active);
        filterBtns[f].classList.toggle("text-white", active);
        filterBtns[f].classList.toggle("border-brand-500", active);
        filterBtns[f].classList.toggle("text-slate-600", !active);
        filterBtns[f].classList.toggle("dark:text-slate-300", !active);
        filterBtns[f].classList.toggle("border-slate-300", !active);
        filterBtns[f].classList.toggle("dark:border-slate-600", !active);
    }

    var items = hw.slice();
    if (hwFilter === "pending") items = items.filter(function(h){ return !h.completed; });
    if (hwFilter === "completed") items = items.filter(function(h){ return h.completed; });
    items.sort(function(a, b){
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        var rank = {urgent: 0, medium: 1, normal: 2};
        var ra = rank[a.priority] != null ? rank[a.priority] : 2;
        var rb = rank[b.priority] != null ? rank[b.priority] : 2;
        if (ra !== rb) return ra - rb;
        return (a.due || "9999").localeCompare(b.due || "9999");
    });

    if (items.length === 0) {
        list.innerHTML = '<p class="text-center text-sm text-slate-400 dark:text-slate-500 py-8">' + escapeHtml(t("hwEmpty")) + '</p>';
        updateHwBadge();
        return;
    }

    for (var j = 0; j < items.length; j++) {
        (function(hwItem){
            var subj = findSubjectById(hwItem.subjectId);
            var nm = subj ? displayName(subj) : "—";
            var prioClass = hwItem.priority === "urgent" ? "prio-urgent" : hwItem.priority === "medium" ? "prio-medium" : "prio-normal";
            var prioLabel = hwItem.priority === "urgent" ? t("prioUrgent") : hwItem.priority === "medium" ? t("prioMedium") : t("prioNormal");

function formatDue(due) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var d = new Date(due); d.setHours(0, 0, 0, 0);
    var diff = Math.round((d - today) / 86400000);
    if (diff < 0) return t("hwDueLate") + " · " + due;
    if (diff === 0) return t("hwDueToday") + " · " + due;
    if (diff === 1) return t("hwDueTomorrow") + " · " + due;
    if (diff <= 3) return t("hwDueAfter") + " " + diff + " " + t("hwDueDays");
    return due;
}

        s.textContent = t("addExamDateHint");

    upcoming.sort(function(a, b){ return a.diff - b.diff; });

    else if (n.diff === 1) d.textContent = t("dayTomorrow");
    else d.textContent = n.diff + " " + t("dayCount");

function renderSmartAssistant() {
    var p = getActiveProfile();
    if (!p) return;
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, "0");
    var mm = String(now.getMinutes()).padStart(2, "0");
    var ss = String(now.getSeconds()).padStart(2, "0");
    setText("saClock", hh + ":" + mm + ":" + ss);
    setText("saDate", now.toLocaleDateString(localeTag(), {weekday: "long", year: "numeric", month: "long", day: "numeric"}));

    var hr = now.getHours();
    var g = t("saGreetHello");
    if (hr >= 5 && hr < 12) g = t("saGreetMorning");
    else if (hr >= 12 && hr < 17) g = t("saGreetNoon");
    else if (hr >= 17 && hr < 22) g = t("saGreetEvening");
    else g = t("saGreetNight");
    setText("saGreeting", g + " " + p.name + "!");

    var week = currentWeekLetter();
    var dayKey = mapDayToKey(now.getDay());
    var todaySlots = (p.timetable[dayKey] || []).filter(function(s){ return s.week === "AB" || s.week === week; });
    var todayLabel = dayLabel(dayKey);

    var todayLine = "";
    if (todaySlots.length === 0) {
        todayLine = "📅 " + todayLabel + ": " + t("saTodayNoClasses");
    } else {
        var sorted = todaySlots.slice().sort(function(a, b){ return a.start.localeCompare(b.start); });
        var nowM = hr * 60 + now.getMinutes();
        var up = null;
        for (var i = 0; i < sorted.length; i++) if (timeToMins(sorted[i].start) > nowM) { up = sorted[i]; break; }

        var nextInfo = "";
        if (up) {
            var sub = findSubjectById(up.subjectId);
            var nm = sub ? displayName(sub) : "";
            var dd = timeToMins(up.start) - nowM;
            nextInfo = dd <= 60 ? " ⏰ " + t("saNextIn") + " " + dd + " " + t("saMinutes") + ": " + nm : " ⏰ " + t("saNextAt") + " " + nm + " " + t("saAt") + " " + up.start;
        } else {
            nextInfo = " ✅ " + t("saAllDone");
        }

        var lst = sorted.map(function(s){
            var sub = findSubjectById(s.subjectId);
            return s.start + " " + (sub ? displayName(sub) : "");
        }).join(" · ");
        todayLine = "📅 " + todayLabel + ": " + lst + "." + nextInfo;
    }
    setText("saTodayLine", todayLine);

    var tom = new Date(now.getTime() + 86400000);
    var tomKey = mapDayToKey(tom.getDay());
    var tomSlots = (p.timetable[tomKey] || []).filter(function(s){ return s.week === "AB" || s.week === week; });
    var tomLabel = dayLabel(tomKey);

    var tomLine = "";
    if (tomSlots.length === 0) {
        tomLine = "📆 " + t("saTomorrowPrefix") + " " + tomLabel + ": " + t("saTomorrowNoClasses");
    } else {
        var sortedT = tomSlots.slice().sort(function(a, b){ return a.start.localeCompare(b.start); });
        var lstT = sortedT.map(function(s){
            var sub = findSubjectById(s.subjectId);
            return s.start + " " + (sub ? displayName(sub) : "");
        }).join(" · ");
        tomLine = "📆 " + t("saTomorrowPrefix") + " " + tomLabel + ": " + lstT + ".";
    }
    setText("saTomorrowLine", tomLine);

    var tomSubjectIds = {};
    for (var i2 = 0; i2 < tomSlots.length; i2++) tomSubjectIds[tomSlots[i2].subjectId] = true;
    var tomDateStr = tom.toISOString().slice(0, 10);
    var pendingHw = (p.homework || []).filter(function(h){ return !h.completed; });
    var hwForTomSubj = pendingHw.filter(function(h){ return tomSubjectIds[h.subjectId]; });
    var hwDueTom = pendingHw.filter(function(h){ return h.due === tomDateStr; });

    var hwLine = "";
    if (pendingHw.length === 0) {
        hwLine = "✅ " + t("saHwNone");
    } else {
        var combined = [];
        var seen = {};
        for (var a = 0; a < hwForTomSubj.length; a++) if (!seen[hwForTomSubj[a].id]) { combined.push(hwForTomSubj[a]); seen[hwForTomSubj[a].id] = true; }
        for (var b = 0; b < hwDueTom.length; b++) if (!seen[hwDueTom[b].id]) { combined.push(hwDueTom[b]); seen[hwDueTom[b].id] = true; }

        if (combined.length > 0) {
            var parts = [];
            var limit = Math.min(combined.length, 4);
            for (var c = 0; c < limit; c++) {
                var h = combined[c];
                var sub = findSubjectById(h.subjectId);
                parts.push((sub ? displayName(sub) : "?") + " — " + h.title);
            }
            hwLine = "📚 " + t("saTomorrowHwPrefix") + " " + parts.join(" · ");
            if (combined.length > 4) hwLine += " ...";
        } else {
            hwLine = "📚 " + t("saHwMany") + " " + pendingHw.length + " " + t("saHwTasks");
        }
    }
    setText("saHomeworkLine", hwLine);
}

/* ============ 31. الترجمة التلقائية ============ */
function detectLang(text) {
    if (/[\u0600-\u06FF]/.test(text)) return "ar";
    if (/[àâçéèêëîïôûùüÿñæœ]/i.test(text)) return "fr";
    return "en";
}
function myMemoryTranslate(text, from, to) {
    return new Promise(function(resolve){
        try {
            var u = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + from + "|" + to;
            fetch(u)
                .then(function(r){ return r.json(); })
                .then(function(j){ resolve((j && j.responseData && j.responseData.translatedText) || null); })
                .catch(function(){ resolve(null); });
        } catch (e) { resolve(null); }
    });
}
function autoTranslateField(fieldId) {
    var inp = document.getElementById(fieldId);
    if (!inp) return;
    var text = inp.value.trim();
    if (!text) return;

    var srcLang = detectLang(text);
    var targets = ["ar", "fr", "en"].filter(function(l){ return l !== srcLang; });

    var dictAll = {};
    dictAll.ar = lookupDict(text, "ar");
    dictAll.fr = lookupDict(text, "fr");
    dictAll.en = lookupDict(text, "en");
    var hasDict = dictAll.ar || dictAll.fr || dictAll.en;

    if (hasDict) {
        if (fieldId === "subjectTitleAr" || fieldId === "subjectTitleFr" || fieldId === "subjectTitleEn") {
            if (dictAll.ar !== null) document.getElementById("subjectTitleAr").value = dictAll.ar;
            if (dictAll.fr !== null) document.getElementById("subjectTitleFr").value = dictAll.fr;
            if (dictAll.en !== null) document.getElementById("subjectTitleEn").value = dictAll.en;
        }
        return;
    }

    if (!appState.autoTranslate) return;

    var btn = event && event.currentTarget;
    if (btn) btn.classList.add("loading");

    var promises = [];
    for (var i = 0; i < targets.length; i++) {
        promises.push(myMemoryTranslate(text, srcLang, targets[i]).then((function(tgt){
            return function(val){ return {lang: tgt, val: val}; };
        })(targets[i])));
    }
    Promise.all(promises).then(function(results){
        var final = {};
        for (var j = 0; j < results.length; j++) {
            if (results[j].val) final[results[j].lang] = results[j].val;
        }
        final[srcLang] = text;

        if (fieldId === "subjectTitleAr" || fieldId === "subjectTitleFr" || fieldId === "subjectTitleEn") {
            if (final.ar !== undefined) document.getElementById("subjectTitleAr").value = final.ar;
            if (final.fr !== undefined) document.getElementById("subjectTitleFr").value = final.fr;
            if (final.en !== undefined) document.getElementById("subjectTitleEn").value = final.en;
        }
        if (btn) btn.classList.remove("loading");
    });
}

function updatePomodoroDisplay() {
    var m = Math.floor(pomodoroSeconds / 60);
    var s = pomodoroSeconds % 60;
    var td = document.getElementById("timerDisplay");
    var pm = document.getElementById("pomodoroMode");
    if (td) td.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    if (pm) {
        pm.textContent = pomodoroMode === "focus" ? t("pomoFocus") : t("pomoBreak");
        pm.className = "text-[10px] font-black uppercase w-12 " +
            (pomodoroMode === "focus" ? "text-brand-600 dark:text-brand-400" : "text-emerald-600 dark:text-emerald-400");
    }
}
function togglePomodoro() {
    if (pomodoroRunning) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
        var b1 = document.getElementById("timerToggleBtn");
        if (b1) b1.innerHTML = '<i class="fa-solid fa-play text-xs"></i>';
    } else {
        pomodoroRunning = true;
        var b2 = document.getElementById("timerToggleBtn");
        if (b2) b2.innerHTML = '<i class="fa-solid fa-pause text-xs"></i>';
        pomodoroInterval = setInterval(function(){
            if (pomodoroSeconds > 0) {
                pomodoroSeconds--;
                updatePomodoroDisplay();
            } else {
                clearInterval(pomodoroInterval);
                pomodoroRunning = false;
                var b3 = document.getElementById("timerToggleBtn");
                if (b3) b3.innerHTML = '<i class="fa-solid fa-play text-xs"></i>';
                if (pomodoroMode === "focus") {
                    alert(t("pomoAlertEndFocus"));
                    pomodoroMode = "break";
                    pomodoroSeconds = 5 * 60;
                } else {
                    alert(t("pomoAlertEndBreak"));
                    pomodoroMode = "focus";
                    pomodoroSeconds = 25 * 60;
                }
                updatePomodoroDisplay();
            }
        }, 1000);
    }
}
function resetPomodoro() {
    clearInterval(pomodoroInterval);
    pomodoroRunning = false;
    pomodoroMode = "focus";
    pomodoroSeconds = 25 * 60;
    updatePomodoroDisplay();
    var b = document.getElementById("timerToggleBtn");
    if (b) b.innerHTML = '<i class="fa-solid fa-play text-xs"></i>';
}

/* ============ 34. بدء التطبيق ============ */
window.addEventListener("DOMContentLoaded", function(){
    /* تحميل الحالة الأولية (للتخزين المحلي) */
    loadState();
    applyTheme();
    
    /* التحقق من وجود جلسة سابقة */
    if (typeof checkExistingSession === 'function') {
        checkExistingSession().then(function(hasSession) {
            /* إذا لا يوجد جلسة، أظهر شاشة تسجيل الدخول */
            if (!hasSession) {
                var authScreen = document.getElementById('authScreen');
                var homeView = document.getElementById('homeView');
                if (authScreen) authScreen.classList.remove('hidden');
                if (homeView) homeView.classList.add('hidden');
            }
        });
    }
    
    /* إعداد اللغة */
    document.documentElement.setAttribute("dir", appState.lang === "ar" ? "rtl" : "ltr");
    document.documentElement.setAttribute("lang", appState.lang);
    var sel = document.getElementById("langSelect");
    if (sel) sel.value = appState.lang;
    
    applyUILanguage();
    updatePomodoroDisplay();
    
    if (countdownTicker) clearInterval(countdownTicker);
    countdownTicker = setInterval(function(){ if (appState.activeUserId) renderCountdown(); }, 60000);
    
    if (assistantClockTicker) clearInterval(assistantClockTicker);
    assistantClockTicker = setInterval(function(){ if (appState.activeUserId) renderSmartAssistant(); }, 1000);
});
</script>
